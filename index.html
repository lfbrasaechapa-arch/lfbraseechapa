<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F0C0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="L&amp;F Comandas">
<link rel="icon" type="image/webp" href="logo.webp">
<link rel="apple-touch-icon" href="logo.webp">
<link rel="manifest" href="manifest.webmanifest">
<title>Comandas L&amp;F Brasa e Chapa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style1.css">
<link rel="stylesheet" href="style2.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<script>try{if(localStorage.getItem("lf-modo")==="claro")document.documentElement.dataset.modo="claro";}catch(e){}</script>
<section id="login" class="gut" hidden>
<div class="box">
<img src="logo.webp" alt="L&amp;F Brasa e Chapa">
<h2>Gerenciador de comandas</h2>
<form id="f-login" autocomplete="on">
<label class="field"><span>E-mail</span><input type="email" id="lg-email" name="email" autocomplete="username" required></label>
<label class="field"><span>Senha</span><input type="password" id="lg-senha" name="senha" autocomplete="current-password" required></label>
<div class="err" id="lg-err"></div>
<button class="btn btn-primary btn-lg" type="submit" id="lg-btn">Entrar</button>
</form>
<p class="hint">Acesso só para a equipe. Peça o seu login ao responsável.</p>
</div>
</section>
<header class="top">
<div class="wrap gut top-in">
<div class="brand">
<img src="logo.webp" alt="L&amp;F Brasa e Chapa">
<div style="min-width:0">
<div style="display:flex;align-items:center;gap:4px"><h1 id="storeName">L&amp;F Brasa e Chapa</h1><button class="brand-edit" data-act="store-name" aria-label="Editar nome do estabelecimento" title="Editar nome">✎</button></div>
<div class="clock" id="clock"></div>
</div>
</div>
<button class="mode-btn" data-act="taxas" type="button" title="Alterar taxas da maquininha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19M6 15h4"/></svg>Taxas</button>
<button class="mode-btn" id="modeBtn" data-act="mode" type="button"></button>
<button class="mode-btn" id="logoutBtn" data-act="logout" type="button" title="Sair">Sair</button>
<nav class="tabs" id="tabs" role="tablist"></nav>
</div>
</header>
<main class="wrap gut" id="app"></main>
<div id="modal"></div>
<div id="toast" hidden></div>
<script src="app1.js"></script>
<script src="app2.js"></script>
<script src="app3.js"></script>
<script src="app4.js"></script>
<script src="app5.js"></script>
<script src="app6.js"></script>
</body>
</html>
